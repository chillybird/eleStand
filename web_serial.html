<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>舵机角度控制</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: system-ui; background: #1a1a2e; color: #e0e0e0;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 100vh;
}
h1 { font-size: 18px; text-align: center; margin-bottom: 16px; color: #e94560; }
.card {
    background: #16213e; border-radius: 16px; padding: 28px;
    width: 400px; box-shadow: 0 8px 32px rgba(0,0,0,.3); margin-bottom: 14px;
}
.status { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 13px; }
.status-dot { width: 10px; height: 10px; border-radius: 50%; background: #666; transition: .3s; }
.status-dot.on { background: #4ecca3; }
.angle-display { text-align: center; font-size: 52px; font-weight: 700; color: #4ecca3; margin-bottom: 12px; }
.angle-display span { font-size: 22px; color: #888; }
.row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.row label { font-size: 12px; color: #888; white-space: nowrap; }
.row input[type=range] { flex: 1; accent-color: #4ecca3; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.btn { padding: 14px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: transform .1s,opacity .2s; }
.btn:active { transform: scale(.96); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-down { background: #e94560; color: #fff; }
.btn-up   { background: #0f3460; color: #fff; }
.btn-conn { background: #4ecca3; color: #1a1a2e; width:400px; font-size:13px; padding:10px; margin-bottom:14px; }
.btn-conn.disconnect { background: #e94560; color: #fff; }
.presets { display: grid; grid-template-columns: repeat(5,1fr); gap: 6px; }
.presets button { padding: 8px; border: none; border-radius: 6px; background: #1a1a2e; color: #e0e0e0; font-size: 12px; cursor: pointer; }
.presets button:hover { background: #4ecca3; color: #1a1a2e; }
.log-area { margin-bottom: 14px; background: #0d1117; border-radius: 8px; padding: 10px; height: 120px; overflow-y: auto; font-family: monospace; font-size: 11px; line-height: 1.5; width: 400px; }
.log-line { color: #8b949e; }
.log-line .rx { color: #4ecca3; }
.log-line .tx { color: #58a6ff; }
</style>
</head>
<body>
<h1>MG90S 舵机角度控制</h1>

<div class="card">
    <div class="status">
        <div class="status-dot" id="dot"></div>
        <span id="statusText">未连接</span>
    </div>
    <div class="angle-display" id="ang">0<span>°</span></div>
    <div class="row">
        <label>0</label>
        <input type="range" id="sl" min="0" max="180" value="0" disabled>
        <label>180</label>
    </div>
    <div class="btns">
        <button class="btn btn-down" id="btnDown" disabled onclick="send('down\n')">&#9660; 放下 0°</button>
        <button class="btn btn-up"   id="btnUp"   disabled onclick="send('up\n')">&#9650; 立起 90°</button>
    </div>
    <div class="presets">
        <button disabled id="b0"  onclick="sendAngle(0)">0°</button>
        <button disabled id="b30" onclick="sendAngle(30)">30°</button>
        <button disabled id="b45" onclick="sendAngle(45)">45°</button>
        <button disabled id="b60" onclick="sendAngle(60)">60°</button>
        <button disabled id="b90" onclick="sendAngle(90)">90°</button>
        <button disabled id="b120" onclick="sendAngle(120)">120°</button>
        <button disabled id="b135" onclick="sendAngle(135)">135°</button>
        <button disabled id="b150" onclick="sendAngle(150)">150°</button>
        <button disabled id="b180" onclick="sendAngle(180)">180°</button>
    </div>
</div>

<div class="log-area" id="log"><div class="log-line">等待连接...</div></div>
<button class="btn btn-conn" id="btnConn" onclick="toggleConnect()">连接设备</button>

<script>
let port = null, reader = null, writer = null, reading = false;
const $ = id => document.getElementById(id);
const dot = $('dot'), statusText = $('statusText'), btnConn = $('btnConn');
const btnDown = $('btnDown'), btnUp = $('btnUp');
const sl = $('sl'), ang = $('ang'), logEl = $('log');
const presets = ['b0','b30','b45','b60','b90','b120','b135','b150','b180'];

function setConnected(v) {
    dot.classList.toggle('on', v);
    statusText.textContent = v ? '已连接' : '未连接';
    btnConn.textContent = v ? '断开连接' : '连接设备';
    btnConn.classList.toggle('disconnect', v);
    btnDown.disabled = !v; btnUp.disabled = !v; sl.disabled = !v;
    presets.forEach(id => $(id).disabled = !v);
}

function showAngle(v) { ang.innerHTML = v + '<span>°</span>'; sl.value = v; }
function log(msg, cls = '') {
    const div = document.createElement('div');
    div.className = 'log-line' + (cls ? ' ' + cls : '');
    div.textContent = msg; logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
}

async function toggleConnect() {
    if (port) { await disconnect(); return; }
    try {
        port = await navigator.serial.requestPort({});
        await port.open({ baudRate: 115200 });
        reader = port.readable.getReader();
        writer = port.writable.getWriter();
        reading = true; setConnected(true);
        log('Connected', 'rx'); readLoop();
    } catch (e) { if (e.name !== 'NotFoundError') log(e.message, 'err'); }
}

async function disconnect() {
    reading = false;
    try { reader?.cancel(); } catch {}
    try { reader?.releaseLock(); } catch {}
    try { writer?.close(); } catch {}
    try { writer?.releaseLock(); } catch {}
    try { await port?.close(); } catch {}
    port = reader = writer = null; setConnected(false);
    log('Disconnected', 'err');
}

async function send(data) {
    if (!writer) return;
    log('TX: ' + data.trim(), 'tx');
    await writer.write(new TextEncoder().encode(data));
}

function sendAngle(v) { showAngle(v); send('angle ' + v + '\n'); }

let sliderTimer;
sl.oninput = function() {
    showAngle(this.value);
    clearTimeout(sliderTimer);
    sliderTimer = setTimeout(() => sendAngle(this.value), 1000);
};

async function readLoop() {
    const dec = new TextDecoder(); let buf = '';
    try {
        while (reading) {
            const { value, done } = await reader.read();
            if (done) break;
            const text = dec.decode(value, { stream: true }); buf += text;
            const lines = buf.split('\n'); buf = lines.pop() || '';
            for (const line of lines) {
                if (!line.trim()) continue;
                log('RX: ' + line.trim(), 'rx');
                const m = line.match(/angle=(\d+)/);
                if (m) showAngle(parseInt(m[1]));
            }
        }
    } catch (e) { if (reading) log(e.message, 'err'); }
    if (reading) await disconnect();
}

navigator.serial?.addEventListener('disconnect', async () => { log('Device disconnected', 'err'); await disconnect(); });
</script>
</body>
</html>
